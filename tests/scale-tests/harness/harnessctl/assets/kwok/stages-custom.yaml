# Custom KWOK Stages layered on top of the upstream default stages.
#
# The upstream release ships default stages (node heartbeat/lease, pod
# scheduling, generic pod completion). These custom stages add the two
# behaviors the harness needs but the defaults do not provide:
#
#   1. Realistic pod termination delay honoring terminationGracePeriodSeconds
#      (S4) so node-drainer eviction timings are meaningful, not instantaneous.
#   2. Janitor Job pods (reboot / GPU reset) that reach Succeeded after a
#      configurable delay (S4 / P0.4) so the janitor action MTTR is non-trivial.
#
# 20-install-kwok.sh substitutes __JOB_COMPLETE_DELAY__ with
# (KWOK_JOB_COMPLETE_DELAY * 1000), i.e. the delay in milliseconds, since
# durationMilliseconds below expects a millisecond integer.
#
# IMPORTANT: validate these against the exact KWOK version pinned in
# config/harness.env (KWOK_VERSION); the Stage schema is v1alpha1 and evolves.
---
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: pod-delete-graceful
spec:
  resourceRef:
    apiGroup: v1
    kind: Pod
  selector:
    matchExpressions:
      - key: '.metadata.deletionTimestamp'
        operator: 'Exists'
      - key: '.metadata.annotations["kwok.x-k8s.io/node"]'
        operator: 'DoesNotExist'
  # Delay finalization until the pod's grace period elapses, so eviction/drain
  # timing reflects terminationGracePeriodSeconds instead of an instant delete.
  delay:
    durationMilliseconds: 1000
    durationFrom:
      expressionFrom: '.metadata.deletionGracePeriodSeconds'
  next:
    delete: true
---
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: janitor-job-pod-complete
spec:
  resourceRef:
    apiGroup: v1
    kind: Pod
  # Match pods created by janitor action Jobs (reboot / GPU reset). Those Jobs
  # are labeled by NVSentinel; we match on the batch.kubernetes.io/job-name
  # existing AND the node being a fake KWOK node.
  selector:
    matchExpressions:
      - key: '.metadata.labels["batch.kubernetes.io/job-name"]'
        operator: 'Exists'
      - key: '.status.phase'
        operator: 'In'
        values:
          - 'Pending'
          - 'Running'
  delay:
    durationMilliseconds: __JOB_COMPLETE_DELAY__
  next:
    statusTemplate: |
      {{ $now := Now }}
      phase: Succeeded
      {{ range .spec.containers }}
      containerStatuses:
        - name: {{ .name }}
          state:
            terminated:
              exitCode: 0
              reason: Completed
              startedAt: {{ $now | Quote }}
              finishedAt: {{ $now | Quote }}
          ready: false
          started: false
      {{ end }}
      conditions:
        - type: Ready
          status: "False"
          reason: PodCompleted
