# kube-prometheus-stack values tuned for a KWOK-scale NVSentinel harness.
#
# Goals:
#  - 15s scrape interval (Observability requirement O1/O3).
#  - Headroom to scrape tens of thousands of fake nodes' cAdvisor/kubelet
#    endpoints WITHOUT scraping every KWOK node (KWOK nodes expose no real
#    kubelet, so node-exporter/kubelet scrape jobs are pointless and expensive).
#  - Retain enough history to diff a >=24h SYS-1 run later.
#
# NOTE: sizing below assumes the 10 real 16 vCPU / 32 GB nodes from the
# Constraints table. Adjust requests/limits to your sandbox.

fullnameOverride: prometheus

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 15d
    retentionSize: "40GB"
    # Compress the WAL: at tens of thousands of targets the WAL is a large share
    # of Prometheus' memory/disk churn; compression trades a little CPU for a lot
    # of headroom at the node ceiling.
    walCompression: true
    # Discover ServiceMonitors/PodMonitors in ALL namespaces regardless of
    # helm-release labels, so NVSentinel + MongoDB + the harness are captured.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        memory: 16Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 60Gi
    # KWOK nodes have no running kubelet; scraping them wastes scrape budget and
    # produces "down" targets. Keep only the real-node kubelet/cadvisor targets.
    additionalScrapeConfigs: []

# The KWOK fake nodes have no kubelet, so the node-exporter DaemonSet and
# kubelet scrape jobs must be constrained to real nodes only.
nodeExporter:
  enabled: true

# node-exporter is a DaemonSet whose default tolerations include
# `{operator: Exists, effect: NoSchedule}`, which tolerates the KWOK
# `kwok.x-k8s.io/node=fake:NoSchedule` taint — so without this it would place a
# pod on EVERY KWOK node (50k pods at the P0.2 target that can never run on a
# missing kubelet). The DaemonSet controller honors nodeAffinity, so exclude
# fake nodes here (subchart values live under `prometheus-node-exporter`, not
# `nodeExporter`). This is what keeps P0.2 cluster CPU/memory within bounds.
prometheus-node-exporter:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: type
                operator: NotIn
                values: ["kwok"]

kube-state-metrics:
  # KSM watches every node/pod object — at 50k nodes this is the single most
  # important scaling knob. Give it real headroom.
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 6Gi
  # Shard KSM if a single replica cannot keep up at the node ceiling.
  # replicas: 2

kubelet:
  enabled: true
  serviceMonitor:
    # THE kubelet-scale knob. The prometheus-operator maintains a single `kubelet`
    # Endpoints object with one address per Node, so at the P0.2 target Prometheus
    # is handed ~50k kubelet + ~50k cAdvisor targets — every KWOK one permanently
    # "down" (no real kubelet), each retried every scrapeInterval. That wastes the
    # scrape budget, inflates Prometheus memory with churn, and buries real-node
    # health in a sea of down targets.
    #
    # There is no per-node selector upstream, so we DROP KWOK targets before the
    # scrape via relabeling. `attachMetadata.node: true` exposes each target's Node
    # object labels as `__meta_kubernetes_node_label_*`, letting us match the same
    # `type=kwok` convention used everywhere else in the harness (prefix-agnostic —
    # survives a change to KWOK_NODE_PREFIX). Overriding `relabelings` /
    # `cAdvisorRelabelings` REPLACES the chart defaults, so the default
    # `metrics_path` rewrite is repeated here before the drop.
    attachMetadata:
      node: true
    cAdvisor: true
    # /metrics/probes and /metrics/resource would each add another ~50k-target
    # scrape set; they carry nothing Phase 0 asserts on, so switch them off.
    probes: false
    resource: false
    relabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: drop
        sourceLabels: [__meta_kubernetes_node_label_type]
        regex: kwok
    cAdvisorRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: drop
        sourceLabels: [__meta_kubernetes_node_label_type]
        regex: kwok

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  adminPassword: "harness"   # sandbox only; not a secret
  resources:
    requests:
      cpu: "250m"
      memory: 512Mi

alertmanager:
  enabled: false   # Phase 0 does not page; scenarios assert via harness checks.

# Trim control-plane scrape jobs that a managed CSP cluster does not expose.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
